name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m pytest -q
      - run: node --input-type=module --check < beyond_move/static/app.js
