[project]
name = "beyond-the-move"
version = "1.0.0"
description = "A Brazilian Portuguese chess practice coach."
requires-python = ">=3.12,<3.13"
dependencies = ["chess==1.11.2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "zstandard>=0.23,<1"]

[project.optional-dependencies]
model = [
    "torch==2.7.1",
    "transformers==4.53.3",
    "peft==0.16.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.12,<1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
